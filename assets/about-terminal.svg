<style>
  text { font: 500 15px 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,Menlo,monospace; }
  .ps { fill: #ff2e88; font-weight: 700; }
  .cmd { fill: #ffffff; font-weight: 600; }
  .out { fill: #9fdcff; }
